# Production stack used by the CI/CD deploy job.
# Required in ~/dxtechs-server/.env on the VPS (never commit it):
#   POSTGRES_USER=...       superuser: only postgres itself, db-roles and admin/backup use it
#   POSTGRES_PASSWORD=...
#   POSTGRES_DB=...
#   DB_OWNER_PASSWORD=...   role dxtechs_owner (migrate)  — generate: openssl rand -hex 24
#   DB_APP_PASSWORD=...     role dxtechs_app   (api)      — generate: openssl rand -hex 24
# Hex passwords on purpose: they go into connection strings without any escaping.
# API_TAG is set by CI to the short commit SHA, so every deploy leaves a tagged
# image behind that can be started again for a rollback (see .github/workflows/ci-cd.yml).
# Log rotation for every container of this stack (10 MB × 3 files each), set here instead of
# /etc/docker/daemon.json: no Docker daemon restart, versioned and reviewed, applied by the next deploy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    # no "ports": the database is reachable only from containers on this network

  # ADR-009: creates/updates roles dxtechs_owner + dxtechs_app and their privileges
  # (deploy/postgres/roles.sql, idempotent) as the superuser, on every deploy, before
  # "migrate". Changing DB_OWNER_PASSWORD / DB_APP_PASSWORD in .env + redeploy = rotation.
  db-roles:
    image: postgres:15
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: ${POSTGRES_DB:?set in .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env (openssl rand -hex 24)}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env (openssl rand -hex 24)}
    volumes:
      - ./deploy/postgres/roles.sql:/roles.sql:ro
    entrypoint: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/roles.sql"]

  # Applies pending EF Core migrations once, then exits. If it fails, the API is
  # not (re)started and the deploy job fails, so the old API keeps serving.
  migrate:
    image: dxtechs-api-migrator:${API_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: migrator
    restart: "no"
    logging: *default-logging
    depends_on:
      db-roles:
        condition: service_completed_successfully
    environment:
      # Owner role: may create/alter schemas and tables, nothing else (no superuser).
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=dxtechs_owner;Password=${DB_OWNER_PASSWORD}

  api:
    image: dxtechs-api:${API_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
      target: final
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # App role: SELECT/INSERT/UPDATE/DELETE only. A bug or SQL injection cannot DROP/ALTER tables.
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=dxtechs_app;Password=${DB_APP_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"   # only Nginx on the VPS can reach it; required by the forwarded-headers setup in Program.cs

volumes:
  postgres_data:
