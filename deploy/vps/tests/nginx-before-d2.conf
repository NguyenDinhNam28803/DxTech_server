server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://dxtechs.com$request_uri;
}
server {
    listen 443 ssl;
    server_name www.dxtechs.com app.dxtechs.com;
    ssl_certificate /etc/letsencrypt/live/dxtechs.com/fullchain.pem;
    return 301 https://dxtechs.com$request_uri;
}
server {
    listen 443 ssl;
    server_name api.dxtechs.com;
    location /api/ {
        proxy_pass http://127.0.0.1:8080;  # { tricky }
    }
    location / { return 404; }
}
server {
    listen 443 ssl default_server;
    server_name dxtechs.com;
    root /var/www/dxtechs/current;
    location /assets/ { expires 1y; }
    # tạm thời: giữ /api/ cho bản client cũ {
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri $uri/ /index.html; }
}
