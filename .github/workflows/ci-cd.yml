name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (.NET 8) & Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # Build the project file directly: the .NET 8 SDK cannot read server.slnx.
      - run: dotnet restore server/server.csproj
      - run: dotnet build server/server.csproj -c Release --no-restore

      # Both images the VPS will build: the API and the one-shot migrations runner.
      - name: Docker build (api)
        run: docker build -f server/Dockerfile --target final -t dxtechs-api:ci .
      - name: Docker build (migrator)
        run: docker build -f server/Dockerfile --target migrator -t dxtechs-api-migrator:ci .

  deploy:
    name: Deploy to VPS (Docker Compose)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - name: Check deploy secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is empty. Add it under Settings > Environments > production > Environment secrets (not Variables)."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Upload source
        run: |
          git archive --format=tar.gz -o src.tgz HEAD
          scp -P "$VPS_PORT" -i ~/.ssh/id_deploy src.tgz "$VPS_USER@$VPS_HOST:/tmp/dxtechs-server.tgz"

      - name: Migrate database & start API
        run: |
          ssh -p "$VPS_PORT" -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            "API_TAG='${GITHUB_SHA::7}' bash -s" <<'EOF'
          set -euo pipefail
          base="$HOME/dxtechs-server"
          if [ ! -f "$base/.env" ]; then
            echo "::error::Missing $base/.env on the VPS (see docker-compose.prod.yml)"; exit 1
          fi
          rm -rf "$base/src" && mkdir -p "$base/src"
          tar -xzf /tmp/dxtechs-server.tgz -C "$base/src"
          rm -f /tmp/dxtechs-server.tgz
          cd "$base"
          export API_TAG
          compose="docker compose -p dxtechs-server --env-file .env -f src/docker-compose.prod.yml"

          # "migrate" runs first; if it fails, compose does not recreate "api",
          # so the previous version keeps serving traffic.
          if ! $compose up -d --build --remove-orphans; then
            echo "::error::docker compose up failed (migrations or build)"
            $compose logs --tail 80 migrate api || true
            exit 1
          fi

          # Readiness = API answers AND can reach PostgreSQL.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health/ready >/dev/null; then
              echo "API is up (image dxtechs-api:$API_TAG)"
              # Keep the 5 newest tags of each image for rollback; drop the rest.
              for repo in dxtechs-api dxtechs-api-migrator; do
                docker image ls "$repo" --format '{{.CreatedAt}}|{{.Repository}}:{{.Tag}}' \
                  | sort -r | tail -n +6 | cut -d'|' -f2 \
                  | xargs -r docker rmi >/dev/null 2>&1 || true
              done
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become ready on 127.0.0.1:8080/api/health/ready"
          $compose logs --tail 80 migrate api
          exit 1
          EOF
